name: Build GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare bundled media
        shell: bash
        run: ./scripts/prepare-media.sh

      - name: Build addon ZIP
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          zip -r "ShatterPulse-${VERSION}.zip" ShatterPulse \
            -x '*/.DS_Store' '*/Thumbs.db'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "ShatterPulse-${VERSION}.zip" \
            --title "ShatterPulse ${VERSION}" \
            --generate-notes
