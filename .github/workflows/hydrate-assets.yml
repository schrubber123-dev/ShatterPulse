name: Hydrate ShatterPulse source

on:
  push:
    paths:
      - 'encoded-src/READY'

permissions:
  contents: write

jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decode Lua source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ShatterPulse
          cat encoded-src/lua/lua.part-* | base64 --decode | gzip --decompress > ShatterPulse/ShatterPulse.lua
          test -s ShatterPulse/ShatterPulse.lua
          grep -q 'local VERSION = "1.0.0"' ShatterPulse/ShatterPulse.lua

      - name: Commit source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r encoded-src
          git add ShatterPulse/ShatterPulse.lua
          git commit -m "Add ShatterPulse Lua source"
          git push
